# JVM options for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent subprojects in parallel.
org.gradle.parallel=true

# AndroidX is required by Jetpack Compose.
android.useAndroidX=true

# Only build the resources that are actually referenced.
android.nonTransitiveRClass=true

# Kotlin compilation runs in its own daemon process.
kotlin.code.style=official
