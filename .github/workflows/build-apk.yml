name: Build APK

# Runs on every push to main, and can be triggered by hand from the
# Actions tab (Run workflow).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed so the job can publish the APK as a GitHub Release asset.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the command-line tools, accepts the Android SDK licences and
      # downloads exactly the platform and build-tools this project needs.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # This repository intentionally ships no gradle-wrapper.jar, so Gradle
      # itself is provided by the action and put on the PATH.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run the unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show what was built
        run: ls -lh app/build/outputs/apk/debug/

      # Download this from the run's summary page (Artifacts section).
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockscreen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also publish it to a rolling "debug" release, which gives a direct
      # download link that is easy to open on a phone.
      - name: Publish to the rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create debug \
            --title "Debug build" \
            --notes "Latest debug APK, built automatically from main." \
            || echo "Release 'debug' already exists — updating the asset."
          gh release upload debug \
            app/build/outputs/apk/debug/app-debug.apk \
            --clobber
